services:

  # ------------------------------------------------------------------
  # BASE DE DONNÉES POSTGRESQL (Synapse)
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: msb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - msb-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------
  # SERVEUR MATRIX SYNAPSE
  # ------------------------------------------------------------------
  synapse:
    image: matrixdotorg/synapse:v1.164.1
    container_name: msb-synapse
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - msb-internal
      - msb-public
      - msb-auth-bridge
    ports:
      - "127.0.0.1:${SYNAPSE_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ------------------------------------------------------------------
  # INTERFACE ELEMENT WEB
  # ------------------------------------------------------------------
  element:
    image: vectorim/element-web:v1.11.109
    container_name: msb-element
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./config/element/config.json:/app/config.json:ro
    networks:
      - msb-public
    ports:
      - "127.0.0.1:${ELEMENT_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ | grep -q 'Element' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------
  # REVERSE PROXY HTTPS LOCAL (Nginx)
  # ------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: msb-proxy
    restart: unless-stopped
    depends_on:
      - element
      - synapse
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./demo/fasovoice:/usr/share/nginx/html/fasovoice:ro
    ports:
      - "${MSB_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${MSB_BIND_ADDRESS:-127.0.0.1}:443:443"
    networks:
      msb-public:
        aliases:
          - messagerie.local
          - auth.messagerie.local
      msb-auth-bridge: {}

  # ------------------------------------------------------------------
  # SENTINEL BF — Détection des connexions suspectes
  # ------------------------------------------------------------------
  sentinel:
    build:
      context: ./sentinel
      dockerfile: Dockerfile
    image: msb-sentinel-bf:1.0
    container_name: msb-sentinel
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      # PostgreSQL Authentik (lecture seule des événements)
      AUTHENTIK_PG_HOST: authentik-postgresql-1
      AUTHENTIK_PG_PORT: "5432"
      AUTHENTIK_PG_USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_PG_PASS: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_PG_DB: ${AUTHENTIK_PG_DB:-authentik}
      # Matrix Synapse
      SYNAPSE_URL: http://synapse:8008
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET}
      SENTINEL_ADMIN_INVITE: "@admin:messagerie.local"
      SENTINEL_MATRIX_PASSWORD: ${SENTINEL_MATRIX_PASSWORD}
      # Webhook auth
      SENTINEL_WEBHOOK_SECRET: ${SENTINEL_WEBHOOK_SECRET}
      # Paramètres de détection
      BRUTE_FORCE_THRESHOLD: "5"
      BRUTE_FORCE_WINDOW: "300"
      SPRAY_ACCOUNTS: "3"
      SPRAY_WINDOW: "600"
      POST_FAIL_THRESHOLD: "3"
      ALERT_COOLDOWN: "600"
      POLL_INTERVAL_SEC: "10"
      DATA_DIR: /data
    volumes:
      - ./data/sentinel:/data
    networks:
      # Pour accéder à Synapse
      msb-auth-bridge: {}
      # Pour accéder à PostgreSQL Authentik
      authentik_default: {}
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/health | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Réseau interne : Synapse <-> PostgreSQL (isolé)
  msb-internal:
    driver: bridge
    internal: true

  # Réseau public : Proxy <-> Element / Synapse
  msb-public:
    driver: bridge

  # Réseau partagé externe avec Authentik
  msb-auth-bridge:
    external: true

  # Réseau Authentik (pour que Sentinel accède à authentik-postgresql-1)
  authentik_default:
    external: true
