# Configuration nginx — Messagerie Souveraine BF
# Reverse proxy HTTPS local avec certificats mkcert
# Domaines : messagerie.local, auth.messagerie.local

# ----------------------------------------------------------------
# HTTP -> HTTPS redirect
# ----------------------------------------------------------------
server {
    listen 80;
    server_name messagerie.local auth.messagerie.local;
    return 301 https://$host$request_uri;
}

# ----------------------------------------------------------------
# messagerie.local — Element Web + Synapse
# ----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name messagerie.local;

    ssl_certificate     /etc/nginx/certs/messagerie.local+3.pem;
    ssl_certificate_key /etc/nginx/certs/messagerie.local+3-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Console d'innovation multilingue de crise — FasoVoice
    location /fasovoice/ {
        alias /usr/share/nginx/html/fasovoice/;
        index index.html;
    }

    # Element Web (racine)
    location / {
        proxy_pass         http://element:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Synapse (Matrix API + OIDC callback)
    location /_matrix/ {
        proxy_pass         http://synapse:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    location /_synapse/ {
        proxy_pass         http://synapse:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ----------------------------------------------------------------
# auth.messagerie.local — Authentik (proxy vers port 9000/9443)
# ----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name auth.messagerie.local;

    ssl_certificate     /etc/nginx/certs/messagerie.local+3.pem;
    ssl_certificate_key /etc/nginx/certs/messagerie.local+3-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://authentik-server-1:9000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
